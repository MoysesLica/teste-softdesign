x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG4J_OPTS: -Dlog4j2.configurationFile=/etc/kafka/log4j2.yaml
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - ./infra/kafka/log4j2.yaml:/etc/kafka/log4j2.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *default-logging
  votacao-service:
    build:
      context: .
      dockerfile: services/votacao-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      VALIDACAO_CPF_URL: ${VALIDACAO_CPF_URL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_VOTO_TOPIC: ${KAFKA_VOTO_TOPIC:-voto-solicitado-v3}
      KAFKA_VOTO_GROUP_ID: ${KAFKA_VOTO_GROUP_ID:-votacao-service-v3}
      KAFKA_VOTO_PARTITIONS: ${KAFKA_VOTO_PARTITIONS:-6}
      KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-6}
      KAFKA_RETRY_ATTEMPTS: ${KAFKA_RETRY_ATTEMPTS:-4}
      KAFKA_RETRY_DELAY: ${KAFKA_RETRY_DELAY:-1s}
      KAFKA_RETRY_MULTIPLIER: ${KAFKA_RETRY_MULTIPLIER:-2}
      KAFKA_RETRY_MAX_DELAY: ${KAFKA_RETRY_MAX_DELAY:-30s}
      KAFKA_RETRY_JITTER: ${KAFKA_RETRY_JITTER:-250ms}
      KAFKA_PUBLICACAO_INTERVALO: ${KAFKA_PUBLICACAO_INTERVALO:-100ms}
      KAFKA_PUBLICACAO_LOTE: ${KAFKA_PUBLICACAO_LOTE:-500}
      KAFKA_PUBLICACAO_TIMEOUT: ${KAFKA_PUBLICACAO_TIMEOUT:-5000}
      KAFKA_METRICAS_INTERVALO: ${KAFKA_METRICAS_INTERVALO:-30s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  validacao-cpf-service:
    build:
      context: .
      dockerfile: services/validacao-cpf-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CPF_SEED_QUANTIDADE: ${CPF_SEED_QUANTIDADE:-100000}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
